[project]
name = "carbotfinder"
version = "0.1.0"
description = "Watches Spanish used-car portals and sends a Telegram alert when a listing matches your filters."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Miguel Balsalobre" }]
keywords = ["scraping", "telegram", "cars", "wallapop", "coches.net", "milanuncios"]
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
carbotfinder = "carbotfinder.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carbotfinder"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W", "RUF"]

[tool.ruff.lint.per-file-ignores]
"carbotfinder/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
